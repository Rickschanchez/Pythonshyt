name: Daily Bright Commits

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config user.name "Rickschanchez"
          git config user.email "shekhardwivedi2006@gmail.com"

      - name: Generate 8 Commits
        run: |
          # Pull latest to avoid conflicts
          git pull origin main --rebase || true
          
          # Loop 8 times for dark green
          for i in {1..8}
          do
            echo "$(date) - CORRECT EMAIL - Commit #$i" >> daily-activity.log
            git add daily-activity.log
            git commit -m "Daily sync #$i"
          done
          
          git push origin main
